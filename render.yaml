services:
  - type: web
    name: neurotree-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npm run build
    startCommand: tsx server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Supabase Transaction Pooler (externo) - configure manualmente no dashboard Render
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RATE_LIMIT_POINTS
        value: "60"
      - key: RATE_LIMIT_DURATION
        value: "60"

# Database removido - usando Supabase externo via pooler
EOF